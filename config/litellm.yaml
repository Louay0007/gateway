# ═══════════════════════════════════════════════════════════════════════
#  LiteLLM gateway configuration
#
#  Active deployments:
#    fast     → GhostCLI claude-sonnet-5   (Responses API)
#    smart    → GhostCLI claude-opus-5-5   (Responses API)
#    frontier → GhostCLI claude-fable-5-1  (Pro-only, Responses API)
# ═══════════════════════════════════════════════════════════════════════

model_list:
  # ── fast: Claude Sonnet 5 via GhostCLI (Responses wire) ──────────────
  - model_name: fast
    litellm_params:
      model: openai/claude-sonnet-5
      api_base: https://ghostcli.cloud/v1
      api_key: os.environ/GHOSTCLI_API_KEY
      timeout: 240
      num_retries: 6
      cooldown_time: 3
    model_info:
      supported_endpoints: ["/v1/chat/completions", "/v1/responses"]
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_creation_input_token_cost: 0.000006
      cache_read_input_token_cost: 0.0000003

  # ── smart: Claude Opus 5.5 via GhostCLI (Responses wire) ─────────────
  - model_name: smart
    litellm_params:
      model: openai/claude-opus-5-5
      api_base: https://ghostcli.cloud/v1
      api_key: os.environ/GHOSTCLI_API_KEY
      timeout: 240
      num_retries: 6
      cooldown_time: 3
    model_info:
      supported_endpoints: ["/v1/chat/completions", "/v1/responses"]
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.000075
      cache_creation_input_token_cost: 0.00003
      cache_read_input_token_cost: 0.0000015

  # ── frontier: Claude Fable 5.1 via GhostCLI (Pro-only) ───────────────
  - model_name: frontier
    litellm_params:
      model: openai/claude-fable-5-1
      api_base: https://ghostcli.cloud/v1
      api_key: os.environ/GHOSTCLI_API_KEY
      timeout: 240
      num_retries: 6
      cooldown_time: 3
    model_info:
      supported_endpoints: ["/v1/chat/completions", "/v1/responses"]
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00005
      cache_creation_input_token_cost: 0.00002
      cache_read_input_token_cost: 0.00000025

# ═══════════════════════════════════════════════════════════════════════
#  Routing
# ═══════════════════════════════════════════════════════════════════════
router_settings:
  routing_strategy: usage-based-routing-v2
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  timeout: 600
  num_retries: 2
  retry_after: 1
  allowed_fails: 3
  cooldown_time: 60
  enable_pre_call_checks: true
  default_max_parallel_requests: 100
  context_window_fallback_dict: {}

# ═══════════════════════════════════════════════════════════════════════
#  Behaviour
# ═══════════════════════════════════════════════════════════════════════
litellm_settings:
  request_timeout: 600
  num_retries: 2
  budget_exceeded_status_code: 429
  drop_params: true
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  json_logs: true

# ═══════════════════════════════════════════════════════════════════════
#  Governance
# ═══════════════════════════════════════════════════════════════════════
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: "90d"

key_list: []