# ═══════════════════════════════════════════════════════════════════════
#  LiteLLM gateway configuration
#
#  Active deployment: SINGLE opencode upstream (openai-compatible).
#  /v1/chat/completions is native; /v1/messages is translated.
#  Determine upstream wire format with:  ./scripts/probe-upstream.sh
#  See DESIGN.md §4 for the reasoning behind each choice.
# ═══════════════════════════════════════════════════════════════════════

model_list:
  # ─────────────────────────────────────────────────────────────────────
  # SINGLE UPSTREAM — opencode Zen free tier via the abc-tunnel proxy.
  # ═════════════════════════════════════════════════════════════════════
  # ONE deployment. The tunnel is OpenAI-compatible at <base>/v1/
  # chat/completions, so a single openai/ registration is all that is
  # needed: LiteLLM POSTs to UPSTREAM_BASE_URL + /chat/completions.
  #
  # /v1/messages still works — LiteLLM TRANSLATES it to chat/completions
  # for this upstream (lossy: Anthropic cache_control is dropped). The
  # tunnel ALSO speaks native /v1/messages, but a second same-named
  # anthropic/ deployment is deliberately NOT registered: LiteLLM's
  # endpoint-based routing picked the anthropic/ one for a
  # /v1/chat/completions call and POSTed to the BARE base URL
  # (.../v1 with no path) → upstream 405. One deployment removes the
  # ambiguity entirely. See DESIGN.md §4.
  #
  # COST IS NOMINAL (dev only): the upstream is FREE, so real cost is $0.
  # These non-zero rates exist only so the gateway's spend/budget/rollup
  # pipeline stays exercisable end-to-end. prices/models.yaml carries the
  # same values (one table, two consumers — resolvePrice + reconcile.sh).
  # Zero them before any real billing relies on this table.
  # TWO DEPLOYMENTS, ONE ALIAS. Both are the `fast` model group, so LiteLLM
  # load-balances across them and falls through to the other when one is rate
  # limited. That is the point: the free pools behind these are individually
  # flaky, and two independent pools are not flaky in the same place at once.
  #
  # Both are reached through 9Router on the VPS: UPSTREAM_BASE_URL points at
  # upstream-edge, which normalises 9Router's wrapped response shape into a
  # plain OpenAI body (see edge/normalise.mjs — it is NOT directly parseable).
  #
  # `openai/` + api_base, not `openrouter/`: this LiteLLM build has no
  # model_cost entry for the openrouter/ provider.
  #
  # Nominal rates are NON-ZERO on purpose. The upstream is genuinely $0, and a
  # $0 model makes every budget a no-op and hides pipeline bugs. Each mirrors
  # prices/models.yaml exactly (one table, two consumers) and equals that
  # model's real paid-tier price, so the nominal charge is defensible.
  # ACTIVE UPSTREAM: space-bunny via https://api.howtofix.id/v1
  #
  # Verified against the live endpoint before wiring this:
  #   - POST /v1/chat/completions -> real completions
  #   - TOOL CALLING -> finish_reason: tool_calls, well-formed arguments
  #   - full agentic loop (call -> tool result -> final answer) -> works
  #   - POST /v1/messages         -> works (Anthropic-native, emits thinking)
  #   - POST /v1/responses        -> 404, NOT offered by this upstream
  #
  # `/v1/responses` is deliberately ABSENT from supported_endpoints: the
  # upstream does not serve it, and declaring an endpoint the upstream lacks
  # makes LiteLLM forward into a 404. codex-cli 0.156 speaks Responses only, so
  # it cannot drive this model directly — see HANDOFF.md.
  #
  # Nominal rates are NON-ZERO on purpose. The upstream is free, and a $0 model
  # makes every budget a no-op and hides pipeline bugs. This provider publishes
  # NO pricing, so these are a documented PLACEHOLDER to keep the spend /
  # budget / rollup pipeline exercisable — replace with real numbers before
  # customer money depends on them. Mirrored in prices/models.yaml.
  # THREE ALIASES, ELEVEN DEPLOYMENTS. `fast` / `smart` / `frontier` are the
  # only names customers ever see (portal/lib/keys/policy.ts enforces aliases,
  # never upstream ids). Every model behind them passed the same gate before
  # being admitted — scripts/probe-upstream-models.sh: tool calling with valid
  # arguments, the tool-result→answer turn, SSE framing, and /v1/messages.
  #
  # Several deployments share one alias ON PURPOSE. A single deployment under
  # an alias is a 60-second outage on any failure: LiteLLM puts the failed
  # deployment in cooldown and there is nothing to fall through to ("No
  # deployments available … Try again in 60 seconds"). With 3–5 deployments,
  # a rate-limited pool is skipped and the request is served by the next one.
  #
  # Every deployment in one tier shares the SAME nominal rates. That keeps the
  # spend math deterministic no matter which deployment serves a request —
  # verify-metering's expected-cost assertions depend on it.
  #
  # Upstream: https://api.howtofix.id/v1 (the provider's own docs give
  # https://howtofix.id/v1, which 404s from nginx — `api.` is load-bearing).
  # The upstream serves chat/completions + /v1/messages natively and 404s on
  # /v1/responses, which the auth-edge translates (edge/responses-shim.mjs).
  # `/v1/responses` is therefore absent from supported_endpoints everywhere:
  # declaring an endpoint the upstream lacks makes LiteLLM forward into a 404.
  #
  # Nominal rates are NON-ZERO placeholders. The upstream is free and this
  # provider publishes NO pricing, so tiered nominal rates keep the spend /
  # budget / rollup pipeline exercisable AND make a `frontier` budget behave
  # differently from a `fast` one. Replace with real numbers before customer
  # money depends on them. Mirrored in prices/models.yaml (one table, two
  # consumers). Tiers differ; deployments within a tier are identical.
  #
  # ── FAST ($0.15 in / $0.60 out per Mtok, nominal) ──
  - model_name: fast
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: os.environ/UPSTREAM_BASE_URL
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 240
      # Free pools 429/5xx under load; retry HERE so a transient failure
      # is latency the client never sees instead of a failed agent run.
      num_retries: 6
      cooldown_time: 3
    model_info:
      supported_endpoints: ["/v1/chat/completions", "/v1/messages"]
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
      cache_creation_input_token_cost: 0.0000003
      cache_read_input_token_cost: 0.000000015
      # deepseek-v4.1-flash: DeepSeek speed variant.

  - model_name: fast
    litellm_params:
