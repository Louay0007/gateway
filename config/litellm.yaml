# ═══════════════════════════════════════════════════════════════════════
#  LiteLLM gateway configuration
#
#  Active deployment: SINGLE opencode upstream (openai-compatible).
#  /v1/chat/completions is native; /v1/messages is translated.
#  Determine upstream wire format with:  ./scripts/probe-upstream.sh
#  See DESIGN.md §4 for the reasoning behind each choice.
# ═══════════════════════════════════════════════════════════════════════

model_list:
  # ════════════════════════════════════════════════════════════════════
  # THREE ALIASES, ONE UPSTREAM — Zaino official infrastructure
  # ════════════════════════════════════════════════════════════════════
  #   fast     → haiku-5.5    (1M context, 64k max output)
  #   smart    → sonnet-5.5   (1M context, 64k max output)
  #   frontier → opus-5.5     (1M context, 64k max output)
  #
  # Context/output verified against the provider's own /v1/models
  # (context_window 1048576, max 65536 output) and mirrored in
  # portal/components/docs/docs-data.ts CONTEXT_WINDOW / MAX_OUTPUT_TOKENS.
  #
  # WHY THE ALIASES STAY SEPARATE: customers' plans, keys and ledgers are
  # all expressed in aliases (plans.models, api_keys.models,
  # usage_records.model). Collapsing to one name would silently invalidate
  # every Pro plan allowlist and every key already issued. Keeping the
  # aliases keeps those rows true and makes a future swap a config edit,
  # not a migration.
  #
  # Rates are NON-ZERO on purpose: a $0 model makes every budget a no-op
  # and hides pipeline bugs. Mirrored in prices/models.yaml exactly (one
  # table, two consumers — enforced by
  # portal/tests/pricing-consistency.test.ts).
  #
  # Only /v1/chat/completions is declared on every entry — declaring an
  # endpoint the upstream lacks makes LiteLLM forward into a 404, which is
  # what kills codex-cli. The edge shim translates /v1/responses → chat
  # before LiteLLM, and LiteLLM translates /v1/messages itself.
  #
  # Upstream credential lives in .env as UPSTREAM_API_KEY (never committed).
  #
  # MAX-THINKING DEFAULTS (measured live against aipilot-weld, Oct 2026).
  # All three models think on EVERY call — even "say ok" spends ~300
  # reasoning tokens on haiku-5.5, ~400 on sonnet-5.5. The effort dial
  # is real and accepted on /v1/chat/completions: minimal≈122,
  # low≈161-292, medium≈400-1015, high≈700-1300, xhigh≈700-1550,
  # max≈473-2269 (task-dependent variance is normal). `none` does NOT
  # disable thinking (≈1319) — there is no off switch on this upstream.
  # So the floor is "always thinking": every alias pins max effort +
  # high verbosity + low temperature by default, and the CLIENT can
  # still downgrade per request (request params win over deployment
  # defaults). Hard-task measurements (rate-limiter + tests, 65k cap):
  # haiku high 6879ch/1200rea → max 7509ch/1494rea;
  # sonnet high 9192ch/1063rea → max 8144ch/2269rea;
  # opus high 9532ch/1570rea → max 9106ch/2002rea.
  # max thinks ~25-110% more; answer length is flat (detail comes from
  # verbosity, not effort). Cost follows completion tokens, so max
  # costs ~15-30% more per hard call for deeper reasoning. That is the
  # trade you asked for: deepest thought by default.
  - model_name: fast
    litellm_params:
      model: openai/haiku-5.5
      api_base: os.environ/UPSTREAM_BASE_URL
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 600
      num_retries: 6
      cooldown_time: 3
      reasoning_effort: max
      verbosity: high
      temperature: 0.2
      top_p: 0.9
    model_info:
      supported_endpoints: ["/v1/chat/completions"]
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      cache_creation_input_token_cost: 0.000002
      cache_read_input_token_cost: 0.0000001
      max_input_tokens: 1048576
      max_output_tokens: 65536

  - model_name: smart
    litellm_params:
      model: openai/sonnet-5.5
      api_base: os.environ/UPSTREAM_BASE_URL
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 600
      num_retries: 6
      cooldown_time: 3
      reasoning_effort: max
      verbosity: high
      temperature: 0.2
      top_p: 0.9
    model_info:
      supported_endpoints: ["/v1/chat/completions"]
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_creation_input_token_cost: 0.000006
      cache_read_input_token_cost: 0.0000003
      max_input_tokens: 1048576
      max_output_tokens: 65536

  - model_name: frontier
    litellm_params:
      model: openai/opus-5.5
      api_base: os.environ/UPSTREAM_BASE_URL
      api_key: os.environ/UPSTREAM_API_KEY
      timeout: 600
      num_retries: 6
      cooldown_time: 3
      reasoning_effort: max
      verbosity: high
      temperature: 0.2
      top_p: 0.9
    model_info:
      supported_endpoints: ["/v1/chat/completions"]
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.000075
      cache_creation_input_token_cost: 0.00003
      cache_read_input_token_cost: 0.0000015
      max_input_tokens: 1048576
      max_output_tokens: 65536

# ═══════════════════════════════════════════════════════════════════════
#  Routing
# ═══════════════════════════════════════════════════════════════════════
router_settings:
  routing_strategy: usage-based-routing-v2
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  timeout: 600
  num_retries: 2
  retry_after: 1
  allowed_fails: 3
  cooldown_time: 60
  enable_pre_call_checks: true
  default_max_parallel_requests: 100
  context_window_fallback_dict: {}
  # SINGLE-DEPLOYMENT SAFETY. Each alias has exactly one deployment,
  # so a cooldown IS an outage ("No deployments available … Try again
  # in 60 seconds") with nowhere to fall through to. Never count
  # client-side errors toward the health counter — a malformed tool
  # argument must fail fast on that request, not take the alias down
  # for a minute for every tenant. 429s burst under load and recover
  # on their own; only genuine server/timeout failures cool down.
  allowed_fails_policy:
    BadRequestErrorAllowedFails: 1000
    AuthenticationErrorAllowedFails: 1000
    ContentPolicyViolationErrorAllowedFails: 1000
    NotFoundErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 3
    RateLimitErrorAllowedFails: 1000
    InternalServerErrorAllowedFails: 3

# ═══════════════════════════════════════════════════════════════════════
#  Behaviour
# ═══════════════════════════════════════════════════════════════════════
litellm_settings:
  request_timeout: 600
  num_retries: 2

  # AGENTIC-LOOP RELIABILITY. A "read, find X, change it" task is N
  # turns, not 1: every turn after the first replays the tool history.
  # Two things kill such loops at the gateway, both fixed here:
  #
  # 1. `modify_params: true` turns on LiteLLM's message sanitization
  #    (orphaned tool_calls get a dummy result, stray tool results
  #    are pruned, empty text blocks filled). Without it a single
  #    interrupted turn (client retry, dropped stream, harness bug)
  #    replays as a provider 400 on EVERY later turn — the agent
  #    reads once, then stalls forever on "next step" with a 400
  #    it cannot fix. See docs/completion/message_sanitization.
  modify_params: true

  # 2. Retry + cooldown policy that NEVER punishes client errors.
  #    With ONE deployment per alias there is nothing to fall through
  #    to: cooling down on a 400 (typo, bad tool arg, orphaned
  #    history) converts one bad request into a 60s "No deployments
  #    available" outage for every key. 400/Auth/ContentPolicy must
  #    never count toward `allowed_fails`; 429/5xx/timeout retry.
  retry_policy:
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    NotFoundErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    TimeoutErrorRetries: 3
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 2
    ServiceUnavailableErrorRetries: 2
    DefaultRetries: 1

  # Return 429, not 402, on budget exhaustion. Clients retry 429 correctly.
  budget_exceeded_status_code: 429

  # Strip params the upstream rejects instead of failing the request.
  drop_params: true

  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

  json_logs: true

# ═══════════════════════════════════════════════════════════════════════
#  Governance
# ═══════════════════════════════════════════════════════════════════════
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # PRIVACY: prompt and response content is NOT persisted.
  store_prompts_in_spend_logs: false

  maximum_spend_logs_retention_period: "90d"

# ═══════════════════════════════════════════════════════════════════════
#  Bootstrap keys
# ═══════════════════════════════════════════════════════════════════════
key_list: []