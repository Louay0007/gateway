# SearXNG — the search backend for the chat's Search and Deep toggles.
#
# WHY SELF-HOSTED. A user's question is the most sensitive thing in this
# product; sending every one of them to a third-party search API is a data
# flow an operator cannot audit. SearXNG queries the engines itself, so the
# only party that sees a query is the box this file is deployed to.
#
# THIS FILE IS THE WHOLE INTEGRATION. Two settings decide whether search
# works at all, and both fail silently in a different way:
#
#   formats: [html, json]   — without `json`, /search?format=json answers
#                             403 and lib/chat/web-search.ts reports
#                             `blocked`, so the feature looks unconfigured.
#   limiter: false          — the rate limiter blocks the portal's own
#                             requests: they arrive from the compose
#                             network, not a browser, so every turn past
#                             the first is throttled.
#
# A minimal settings.yml rather than a full copy: SearXNG merges this over
# its own defaults, so only the keys we care about belong here. A full copy
# would freeze every unrelated default at the version it was pasted from.

use_default_settings: true

general:
  instance_name: "Zaino search"

server:
  # Binds on all interfaces INSIDE the container only. The compose file
  # publishes no port, so this is reachable from the portal and nothing
  # else — the same rule the engine follows.
  bind_address: "0.0.0.0"
  port: 8080
  # `json` is the API. `html` is kept so an operator can curl the instance
  # by hand while debugging and see what the engines returned.
  secret_key: "zaino-searxng-internal-not-a-credential"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  # JSON is what lib/chat/web-search.ts reads. HTML-only instances 403.
  formats:
    - html
    - json
  # One page of results is enough: the portal asks for at most 10
  # candidates and reads the top 8, so paging deeper only costs latency.
  default_lang: "en"
  safe_search: 0
  autocomplete: ""
  # No paging: the portal asks for at most 10 candidates and reads the top
  # 8, so a second page is latency nobody consumes.
  max_page: 1

outgoing:
  # Measured on this instance: a general query answers in 0.9–2.7s with a
  # cold pool. The portal's own budget is 6s (SEARCH_TIMEOUT_MS), so 3.5s
  # per engine leaves room for the slowest engine to be dropped rather than
  # the whole search timing out — SearXNG returns the engines that answered
  # and lists the rest as unresponsive.
  request_timeout: 3.5
  max_request_timeout: 5.0
  # A pool with keep-alive: the portal asks several times per conversation,
  # and a fresh TLS handshake to every engine on every query is the single
  # biggest latency cost in a self-hosted SearXNG.
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
