# n8n — the D17 proof-verification workflow runner. NOT part of the app stack.
#
#   docker compose -f docker-compose.n8n.yml up -d
#
# Kept in its own file for the same reason as docker-compose.monitoring.yml:
# `docker compose up` for the app must never pull an automation engine onto a
# box, and turning the agent off is pruning one container rather than editing
# the app compose.
#
# WHY LOOPBACK, NOT A PUBLIC PORT. This instance is not a SaaS tenant
# console; it is one workflow and its editor. Bound to 127.0.0.1 so reach it
# over an SSH tunnel:
#
#   ssh -L 5678:127.0.0.1:5678 ubuntu@<box>
#   open http://127.0.0.1:5678
#
# An exposed 5678 is an unauthenticated-by-default editor on a public IP, and
# n8n's code nodes execute JavaScript — that is remote code execution by
# design, which is fine on loopback and indefensible on the internet.
#
# WHAT IT TALKS TO, and the two tokens it needs:
#
#   D17_AGENT_TOKEN     read the queue, submit readings. Lives in the app
#                       .env; pass the SAME value here.
#   ZAINO_AGENT_API_KEY a Zaino gateway key for the vision call. The reader
#                       is metered like any other request, so it must be a
#                       real key rather than the master key. Mint one from an
#                       org you own; it never leaves this container.
#
# The scheduled workflow ships INACTIVE (ops/n8n/d17-verify.json has
# "active": false). Import it, run it once by hand against a real pending
# payment, and only then enable the schedule. See ops/n8n/README.md.
services:
  n8n:
    # Pinned, and recent on purpose: the instance-owner env vars this file
    # relies on do not exist in early 1.x. `stable` is a moving tag; this is
    # a deploy that was actually tested, not "whatever shipped overnight".
    image: docker.n8n.io/n8nio/n8n:2.48.6
    container_name: gateway-n8n
    restart: unless-stopped
    ports:
      # Loopback only. See the header.
      - "127.0.0.1:5678:5678"
    environment:
      # SQLite inside the volume. n8n's own Postgres is NOT the portal's,
      # and pointing it at the app database would be a second writer on a
      # schema this project owns.
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # A LOGIN, NOT basic auth. n8n 1.x removed N8N_BASIC_AUTH_* — setting
      # them does nothing, which is worse than not setting them, because it
      # looks like a lock. The owner account is provisioned from env instead
      # (docs: environment-variables/user-management-smtp-2fa). The password
      # hash is bcrypt: generate one with
      #   docker run --rm httpd:2.4-alpine htpasswd -bnBC 10 "" 'PASSWORD'
      # and paste the part after ":$2y$".
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=${N8N_INSTANCE_OWNER_EMAIL:?set in .env}
      - N8N_INSTANCE_OWNER_FIRST_NAME=${N8N_INSTANCE_OWNER_FIRST_NAME:-Owner}
      - N8N_INSTANCE_OWNER_LAST_NAME=${N8N_INSTANCE_OWNER_LAST_NAME:-}
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=${N8N_INSTANCE_OWNER_PASSWORD_HASH:?set in .env}
      # `$env` in an expression — and `process.env` in a Code node — is
      # BLOCKED by default. Without this line both tokens read as undefined
      # and every call leaves without an Authorization header, which surfaces
      # as three 401s per run rather than as a configuration error.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - D17_AGENT_TOKEN=${D17_AGENT_TOKEN:?set in .env}
      - ZAINO_AGENT_API_KEY=${ZAINO_AGENT_API_KEY:?set in .env}
      - GENERIC_TIMEZONE=Africa/Tunis
      - TZ=Africa/Tunis
      # n8n prunes its own execution history; unbounded it is the one thing
      # in this container that grows without limit.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    volumes:
      - n8n-data:/home/node/.n8n
    # The box runs LiteLLM at ~1.5G on 3.8G total. A vision workflow that
    # forks on a backlog must not take the gateway down with it, so the cap
    # is a ceiling, not a target.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n-data:
