services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `portal` database on FIRST BOOT ONLY — Docker runs
      # initdb scripts exactly once, when the data directory is empty. On
      # a cluster that already exists this mount is a no-op, which is why
      # `make db-init` exists and is idempotent: run it after every
      # upgrade that adds a database.
      - ./portal/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Loopback only, and deliberately so. `portal/.env.local` points at
    # `postgresql://…@127.0.0.1:5432/portal`, but nothing published that
    # port, so every host-side tool that trusted the DSN — drizzle-kit
    # studio, the seed scripts, `npm run jobs` — failed with ECONNREFUSED
    # against a database that was up and healthy.
    #
    # Binding to 127.0.0.1 (NOT "5432:5432") makes that DSN true while
    # keeping the original rule intact: the database is still unreachable
    # from anywhere but the host itself. On the VPS that means it is not
    # exposed to the internet, which is what "Internal network only"
    # was protecting.
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set in .env}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    # Pinned exact tag. Never :latest — it makes rollbacks
    # non-deterministic. Verify the current stable before changing.
    #   ghcr.io/berriai/litellm/tags
    # Tag and v-prefixed tag resolve to the same image since v1.84.0.
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.103.1}
    restart: unless-stopped
    command:
      - "--config=/app/config/litellm.yaml"
      - "--num_workers=${NUM_WORKERS:-2}"
      - "--port=4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in .env}
      LITELLM_MODE: PRODUCTION

      # ERROR, not DEBUG. The default is DEBUG, and DEBUG logging is
      # LiteLLM's documented #1 latency cause on large payloads.
      # Raise to INFO only while debugging a live incident, then put back.
      LITELLM_LOG: ERROR

      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

      # Upstream. Never read from a request field.
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?set in .env}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?set in .env}
      # GHOSTCLI_API_KEY is deliberately NOT passed here.
      #
      # `fast` and `smart` both authenticate with UPSTREAM_API_KEY now (see
      # config/litellm.yaml), and nothing in litellm.yaml references
      # os.environ/GHOSTCLI_API_KEY any more. This line used to be
      # `${GHOSTCLI_API_KEY:?set in .env}`, which made a key that NO model
      # reads a hard boot requirement: deleting the dead secret from .env
      # would have taken the whole gateway down at `up`.
      #
      # The pairing rule still holds for live secrets: any os.environ/ or
      # process.env reference needs a matching line in this file. Verify with
      #   docker exec gateway-litellm-1 sh -lc 'printenv UPSTREAM_API_KEY | wc -c'
      LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX: ${LITELLM_ANTHROPIC_DISABLE_URL_SUFFIX:-false}

      STORE_MODEL_IN_DB: "True"
      # FALSE, matching general_settings.store_prompts_in_spend_logs in
      # config/litellm.yaml. This line used to say "True" and silently won
      # over the config: every request's full prompt and full response was
      # persisted in LiteLLM_SpendLogs, which grew to 773 MB for 5,315 rows
      # (~145 KB each) and put customer conversation content at rest on the
      # box. Metering never reads it — collect_usage derives everything
      # from token counts (see lib/jobs/collect-usage.ts), so this costs
      # the business nothing and stops the leak.
      STORE_PROMPTS_IN_SPEND_LOGS: "False"
    volumes:
      - ./config:/app/config:ro
    ports:
      # LOOPBACK ONLY. Single most important line in this file.
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  portal:
    build:
      context: ./portal
      target: runner
      args:
        # Build-time, because Next inlines NEXT_PUBLIC_* — /sitemap.xml and
        # /robots.txt are prerendered and cannot read the runtime env. This
        # is the portal origin, not a secret.
        NEXT_PUBLIC_APP_URL: https://${PORTAL_DOMAIN:?set in .env}
    restart: unless-stopped
    environment:
      # Our own database. db/index.ts REFUSES to start against `litellm`,
      # so a copy-paste error here fails loudly
      # instead of silently writing into LiteLLM's schema.
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/portal

      # Gateway over the compose network. REST ONLY.
      LITELLM_INTERNAL_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}

      # Auth.js self-hosted. AUTH_TRUST_HOST is safe here and only here:
      # Caddy is the only thing in front of this port and it sets Host
      # from the TLS SNI. Never enable AUTH_DEBUG in production — it logs
      # the sign-in POST body, password included (auth.ts).
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      AUTH_URL: https://${PORTAL_DOMAIN:?set in .env}
      AUTH_TRUST_HOST: "true"
      AUTH_DEBUG: "false"

      # Seals each org's chat gateway key at rest (lib/crypto/sealed.ts).
      # A SEPARATE value from AUTH_SECRET on purpose: rotating one must not
      # rotate the other, and a leak of the session-signing key must not
      # also yield every stored gateway credential. Generate with
      # `openssl rand -base64 32`; 32 bytes, base64, no passphrase.
      CHAT_KEY_SECRET: ${CHAT_KEY_SECRET:?set in .env}

      # Document extraction + conversation search, over the compose
      # network. Deliberately DEFAULTED to empty, not required: an operator
      # who does not run the engine must still get a working chat product,
      # and lib/engine/client.ts treats an empty token as "feature off"
      # rather than "service down". Setting :? here would take the whole
      # portal down for a feature that degrades cleanly.
      ENGINE_URL: http://engine:8099
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
      ENGINE_MAX_UPLOAD_BYTES: ${ENGINE_MAX_UPLOAD_BYTES:-26214400}

      # Web search (lib/chat/web-search.ts). DEFAULTED EMPTY, not required:
      # no backend means the Search button is simply not offered, which is
      # the same fail-closed posture as ENGINE_TOKEN above.
      #
      # This block is the difference between "configured" and "works" — the
      # GHOSTCLI_API_KEY outage was exactly this: present in .env, never
      # passed into the container, so searchProvider() answered 'none' and
      # the button vanished with no error anywhere.
      # Defaulted to the service below, not empty: search is part of the
      # stack now, and an operator who never sets this would otherwise get
      # no Search button and no reason why. Point it at an external
      # instance to override.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      BRAVE_SEARCH_KEY: ${BRAVE_SEARCH_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # Public gateway host, for the quickstart snippet on /dashboard/keys.
      API_DOMAIN: ${API_DOMAIN:?set in .env}
      NEXT_PUBLIC_APP_URL: https://${PORTAL_DOMAIN:?set in .env}
      APP_URL: https://${PORTAL_DOMAIN:?set in .env}

      # The portal reads the SAME price table as the gateway. One file,
      # two consumers — a divergence here is a silent margin bug.
      PRICE_FILE: /app/prices/models.yaml

      LITELLM_LOG: ERROR

      # Billing. Provider-agnostic: `dev` runs the simulated payment
      # (BILLING_DEV_SECRET mirrors the jobs service so the callback
      # signature verifies identically from either side); `d17` is the
      # real PSP once finalised. See lib/billing/types.ts.
      BILLING_PROVIDER: ${BILLING_PROVIDER:-dev}
      BILLING_DEV_SECRET: ${BILLING_DEV_SECRET:?set in .env}
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_PAYMENTS_WEBHOOK_KEY: ${DODO_PAYMENTS_WEBHOOK_KEY:-}
      DODO_PAYMENTS_ENVIRONMENT: ${DODO_PAYMENTS_ENVIRONMENT:-test_mode}

      # Email. Password reset lives here (lib/auth/reset.ts); receipts
      # for the real payment provider reuse the same transport. Delivery
      # is a direct STARTTLS submission to the mailbox provider — no
      # local MTA, because this host cannot open outbound port 25.
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Gateway <noreply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      # Without this line the variable is silently ignored: lib/email/smtp.ts
      # reads it to decide implicit TLS (465) vs STARTTLS (587), and its
      # absence turns a 465 submission into a plaintext handshake that the
      # provider drops.
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}

      # Admin console gate. Shared secret for the entry screen at /admin —
      # the code the operator types before any staff login form renders.
      #
      # Wiring, not value: the secret itself lives in the server's .env and
      # never leaves the box. This line only carries it into the portal
      # container, where layout.tsx, page.tsx and the gate route all read
      # process.env.ADMIN_GATE_SECRET. Without it the container sees
      # nothing, the route answers 503, and gatePassed() treats the gate as
      # disabled — which would be an OPEN console, not a locked one, once
      # the IP allowlist is ever relaxed.
      #
      # Same bug class as the GHOSTCLI_API_KEY outage: present in .env,
      # never passed into the service. Any NEW os.environ/process.env
      # reference needs its matching line here, verified with:
      #   docker exec gateway-portal-1 sh -lc 'printenv ADMIN_GATE_SECRET | wc -c'
      # (non-zero means wired; the value itself is never printed).
      #
      # `:?` is load-bearing: it fails the compose up LOUDLY on a box whose
      # .env predates this line, instead of silently running an ungated
      # console. `:-` would be the wrong default operator here.
      ADMIN_GATE_SECRET: ${ADMIN_GATE_SECRET:?set in .env}

      # D17 manual payments (La Poste Tunisienne) — the customer pages
      # and the admin queue both run in this container.
      D17_RECEIVER_PHONE: ${D17_RECEIVER_PHONE:-}
      PAYMENT_WINDOW_HOURS: ${PAYMENT_WINDOW_HOURS:-24}
      AUTH_NUMBER_REGEX: ${AUTH_NUMBER_REGEX:-^[A-Za-z0-9]{4,32}$}
      D17_USD_TND_RATE: ${D17_USD_TND_RATE:-3.1}
      D17_UPLOADS_DIR: /app/data/d17-uploads
      D17_REVIEW_THRESHOLD: ${D17_REVIEW_THRESHOLD:-3}
      D17_REVIEW_WINDOW_MINUTES: ${D17_REVIEW_WINDOW_MINUTES:-60}
      D17_MAX_PROOF_PER_HOUR: ${D17_MAX_PROOF_PER_HOUR:-5}

    volumes:
      - ./prices:/app/prices:ro
      # D17 proof screenshots: outside the web root, staff-only reads.
      - ./data/d17-uploads:/app/data/d17-uploads
      # Self-hosted desktop installers, read by /api/downloads to list
      # what's published. Read-only; Caddy serves the bytes directly.
      - ./data/downloads:/app/data/downloads:ro
    ports:
      # LOOPBACK ONLY. Caddy is the sole public entry point; publishing
      # this on 0.0.0.0 would serve the dashboard without TLS and without
      # the security headers.
      - "127.0.0.1:3000:3000"
    healthcheck:
      # Busybox wget ships in the alpine base — no curl dependency.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      litellm: { condition: service_started }
      # Started, not healthy: search degrades to "no results", and a slow
      # first boot must never hold the portal's own start.
      searxng: { condition: service_started }

  jobs:
    # The background runner: usage collection,
    # rollups, entitlement reconcile. A separate image target because the
    # runner imports db/ and lib/ directly and needs the real dependency
    # tree, which the standalone Next bundle does not contain.
    build:
      context: ./portal
      target: jobs
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/portal
      LITELLM_INTERNAL_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      PRICE_FILE: /app/prices/models.yaml
      LITELLM_LOG: ERROR
      # Billing (provider-agnostic; the dev provider needs the portal's
      # origin for its simulator URL and the callback it drives).
      BILLING_PROVIDER: ${BILLING_PROVIDER:-dev}
      BILLING_DEV_SECRET: ${BILLING_DEV_SECRET:?set in .env}
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_PAYMENTS_WEBHOOK_KEY: ${DODO_PAYMENTS_WEBHOOK_KEY:-}
      DODO_PAYMENTS_ENVIRONMENT: ${DODO_PAYMENTS_ENVIRONMENT:-test_mode}
      APP_URL: http://127.0.0.1:3000
      # Reach the portal over the compose network (not the host's
      # loopback, which inside a container is the container itself).
      PORTAL_INTERNAL_URL: http://portal:3000

      # Email. Shares the portal's transport settings, including
      # SMTP_SECURE — see the note in the portal service above.
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Gateway <noreply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}

      # D17 manual payments (La Poste Tunisienne). No API — a human
      # verifies each transfer; these are the queue's settings.
      D17_RECEIVER_PHONE: ${D17_RECEIVER_PHONE:-}
      PAYMENT_WINDOW_HOURS: ${PAYMENT_WINDOW_HOURS:-24}
      AUTH_NUMBER_REGEX: ${AUTH_NUMBER_REGEX:-^[A-Za-z0-9]{4,32}$}
      D17_USD_TND_RATE: ${D17_USD_TND_RATE:-3.1}
      D17_UPLOADS_DIR: /app/data/d17-uploads
      D17_REVIEW_THRESHOLD: ${D17_REVIEW_THRESHOLD:-3}
      D17_REVIEW_WINDOW_MINUTES: ${D17_REVIEW_WINDOW_MINUTES:-60}
      D17_MAX_PROOF_PER_HOUR: ${D17_MAX_PROOF_PER_HOUR:-5}
    volumes:
      - ./prices:/app/prices:ro
      # Proof screenshots live OUTSIDE the web root (the standalone
      # bundle serves nothing from here) and are only ever read by the
      # staff-only route after an authorization check.
      - ./data/d17-uploads:/app/data/d17-uploads
    depends_on:
      postgres: { condition: service_healthy }
      litellm: { condition: service_started }

  engine:
    # Document extraction + conversation search (Rust, engine/).
    #
    # WHY A SEPARATE SERVICE. Extraction is CPU-bound and parses untrusted
    # user files; in the Next.js process it would either stall the event
    # loop on a 200-page PDF or need a worker per upload. Here it runs on
    # its own blocking pool, so a pathological file costs one request.
    #
    # NOT PUBLISHED. There is no `ports:` on purpose — the engine has no
    # user context and trusts its bearer token, so it must only be
    # reachable over the compose network. Caddy never proxies to it.
    build:
      context: .
      dockerfile: engine/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      # Required, no default: the engine parses untrusted documents and
      # fails closed at boot without it (engine/src/server.rs).
      ENGINE_TOKEN: ${ENGINE_TOKEN:?set in .env}
      ENGINE_PORT: "8099"
      ENGINE_INDEX_DIR: /var/lib/zaino-engine/index
      # Bounds a single upload before any parser is touched.
      ENGINE_MAX_UPLOAD_BYTES: ${ENGINE_MAX_UPLOAD_BYTES:-26214400}
      RUST_LOG: ${RUST_LOG:-zaino_engine=info,tower_http=warn}
    volumes:
      # The tantivy index is DERIVED data — Postgres owns the messages.
      # Losing this volume costs a reindex, never a message, which is why
      # it is a plain volume and not a backup target.
      - engineindex:/var/lib/zaino-engine/index
    healthcheck:
      # `--version` needs no shell and no secret, which is why the binary
      # answers it before env parsing. A curl-based check would mean adding
      # curl to a slim image purely to let the container report on itself.
      test: ["CMD", "/usr/local/bin/zaino-engine", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  searxng:
    # The search backend for the chat's Search and Deep toggles
    # (lib/chat/web-search.ts). Self-hosted so a user's question never
    # leaves the box: a third-party search API sees every query, and a
    # query is the most revealing thing in this product.
    #
    # PINNED, like litellm. `:latest` moves under us and a settings key
    # renamed upstream would silently stop the JSON API.
    image: searxng/searxng:2026.11.5-3e95f6cd2
    restart: unless-stopped
    environment:
      # SearXNG reads its settings from this path; the file is mounted
      # read-only below. `SEARXNG_SETTINGS_PATH` is the documented name.
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      # SearXNG refuses to start with a default secret. This is NOT a
      # credential for anything outside the container — it signs its own
      # internal session state, and the instance has no users.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-zaino-searxng-internal}
      # Keeps logs to warnings: a query string in a container log is a
      # user's question written to disk, which is exactly what
      # self-hosting was meant to avoid.
      SEARXNG_LOG_LEVEL: WARNING
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    # NOT PUBLISHED, same rule as the engine: there is no `ports:`. The
    # portal reaches it over the compose network and Caddy never proxies
    # to it, so the instance cannot be used as an open proxy by anyone
    # who finds the host.
    healthcheck:
      # `/healthz` answers without a query, so a warm-up search is not
      # needed and no query is spent checking liveness.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous: the first start fetches engine definitions and builds
      # its cache, which is slower than any later start.
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?set in .env}
      CODE_DOMAIN: ${CODE_DOMAIN:?set in .env}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set in .env}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      # The admin gate page, served by the `handle /admin` block in the
      # Caddyfile (root * /etc/caddy, try_files /admin-gate.html). Without
      # this mount /admin answered 404 — the file existed in the repo but
      # never reached the container, so the gate was unreachable and the
      # console fell through to Next.js. Read-only; a static file with no
      # secrets in it.
      - ./config/admin-gate.html:/etc/caddy/admin-gate.html:ro
      # Self-hosted desktop installers, served directly by the
      # `route /downloads/*` block (root * /opt/gateway/data/downloads).
      # The host dir is the single source of truth; the portal lists it
      # via its own ./data/downloads mount for /api/downloads.
      - ./data/downloads:/opt/gateway/data/downloads:ro
      - caddydata:/data
      - caddyconfig:/config
    # HOST NETWORKING, and this is load-bearing rather than stylistic.
    #
    # The Caddyfile proxies three upstreams by HOST LOOPBACK:
    #   127.0.0.1:4000  litellm    (published on the host)
    #   127.0.0.1:3000  portal     (published on the host)
    #   127.0.0.1:4096  opencode-web — a systemd unit on the HOST, which
    #                            no container network can reach at all
    #
    # On the default bridge network, 127.0.0.1 inside the caddy container
    # is the CONTAINER's loopback: every one of those upstreams would fail
    # to connect. Host networking makes the file correct as written.
    #
    # Trade-off, stated plainly: caddy binds the host's :80/:443 directly,
    # so `ports:` must be absent (Docker rejects it in host mode), and
    # nothing else may bind those ports. `remote_ip` matching in the
    # IP-gated vhosts still works — with no CDN, the TCP peer IS the
    # client.
    network_mode: host
    depends_on:
      - auth-edge
      - litellm

  # ── auth-edge: `zn-` → `sk-` at the credential boundary ──────────────
  # Customers hold `zn-<body>`; LiteLLM hashes `sk-<body>` and its key
  # normalizer only hashes values beginning with `sk-`, so a `zn-` value
  # could never match the stored hash. The body is chosen by the portal and
  # is identical in both forms — this restores the gateway's prefix and
  # nothing else. See edge/server.mjs for the fail-closed rules.
  #
  # Host networking for the same reason as caddy: it must reach LiteLLM on
  # the HOST's 127.0.0.1:4000 (litellm publishes there, loopback only), and
  # Caddy reaches the edge the same way. AUTH_EDGE_HOST is pinned to
  # 127.0.0.1 in the image, so nothing is exposed on a routable interface.
  auth-edge:
    build:
      context: ./edge
    restart: unless-stopped
    network_mode: host
    environment:
      AUTH_EDGE_HOST: 127.0.0.1
      AUTH_EDGE_PORT: "4001"
      AUTH_EDGE_UPSTREAM: http://127.0.0.1:4000
    healthcheck:
      # Busybox wget ships in the alpine base — no curl dependency.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4001/__edge/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - litellm

  # ── Email delivery ─────────────────────────────────────────────────
  # The portal submits straight to Namecheap Private Email over port 587
  # (STARTTLS). No self-hosted MTA: this host cannot open outbound port
  # 25 (AWS/Lightsail), so a local mail server could never deliver
  # directly anyway — it could only relay, and Private Email already IS
  # the relay that owns the sending domain (sohabi.app), its DKIM key
  # (privateemail._domainkey) and its SPF include.
  #
  # The transport lives in portal/lib/email/smtp.ts; configure it in .env:
  #   EMAIL_TRANSPORT=smtp
  #   SMTP_HOST=mail.privateemail.com
  #   SMTP_PORT=587
  #   SMTP_SECURE=false          # 587 is STARTTLS, not implicit TLS
  #   SMTP_USER=<mailbox>        # e.g. ceo-louayrjili@sohabi.app
  #   SMTP_PASS=<mailbox password>
  #   MAIL_FROM="Zaino AI <same mailbox>"

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  # The tantivy search index. Derived data: losing it costs a reindex,
  # never a message (Postgres owns the truth), so it is not a backup
  # target and does not belong in the restore runbook.
  engineindex: