# Your price table. Reviewed monthly against the provider's live
# pricing page. Do NOT hardcode values from documentation examples.
#
# ── CURRENT UPSTREAM (dev): OpenRouter free tier ────────────────────
# Active model: `fast` → openai/poolside/laguna-s-2.1:free
# (OpenRouter base https://openrouter.ai/api/v1)
#
# The upstream is FREE ($0/$0 — verified against OpenRouter's live
# catalogue), so the rates below are NOMINAL DEV RATES, not real provider
# prices. They exist so the gateway's spend / budget / rollup pipeline
# stays exercisable end-to-end (a $0 model makes every budget a no-op and
# hides pipeline bugs). These values are mirrored, per-token, in
# config/litellm.yaml's model_info — ONE table, TWO consumers (portal
# resolvePrice + scripts/reconcile.sh). Keep them in sync, and zero them
# before any real billing relies on this table.
#
# resolvePrice() strips the provider prefix and matches the bare model by
# prefix. LiteLLM reports this upstream as `openai/poolside/laguna-s-2.1:free`,
# so the bare form is `laguna-s-2.1:free`; the key below is that exact bare
# name (no `openai/`, no `poolside/`), matching the `fast` alias.
models:
  laguna-s-2.1:free:
    input_per_mtok:          0.60   # OpenRouter PAID tier of the same model
    cache_write_5m_per_mtok: 0.75
    cache_write_5m_note:     1.25x input (nominal, mirrors litellm.yaml)
    cache_write_1h_per_mtok: 1.20
    cache_write_1h_note:     2.0x input (nominal)
    cache_read_per_mtok:     0.06
    cache_read_note:         0.10x input (nominal)
    output_per_mtok:         2.40   # OpenRouter PAID tier of the same model

# ── When the real Anthropic models return, restore rows like these ──
# (kept commented as the reference shape; multipliers are stable:
#  write-5m = 1.25x, write-1h = 2.0x, cache-read = 0.10x, EXCEPT
#  Fable 5.1 (0.025x) and Opus 5.5 (0.05x)).
#
#   claude-sonnet-5:
#     input_per_mtok:          2.00
#     cache_write_5m_per_mtok: 2.50
#     cache_write_1h_per_mtok: 4.00
#     cache_read_per_mtok:     0.20
#     output_per_mtok:         10.00
#
# Long-context tiers price differently above a context threshold.
# Add them explicitly rather than approximating.
#
# long_context:
#   threshold_tokens: 200000
#   input_per_mtok: 6.00
#   output_per_mtok: 22.50