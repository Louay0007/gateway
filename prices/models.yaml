# Your price table. Reviewed monthly against the provider's live
# pricing page. Do NOT hardcode values from documentation examples.
#
# ── CURRENT UPSTREAM (dev): howtofix.id ────────────────────────────
# Active model: `fast` → openai/space-bunny
# (base https://api.howtofix.id/v1)
#
# The upstream is FREE and this provider publishes NO pricing — its
# /v1/models response carries no `pricing` object, only
# `supported_endpoint_types`. The rates below are therefore NOMINAL DEV
# RATES, not real provider prices. They exist so the gateway's spend /
# budget / rollup pipeline stays exercisable end-to-end (a $0 model makes
# every budget a no-op and hides pipeline bugs). Replace them with real
# numbers before any customer money depends on them.
#
# These values are mirrored, per-token, in config/litellm.yaml's
# model_info — ONE table, TWO consumers (portal resolvePrice +
# scripts/reconcile.sh). Keep them in sync, and zero them if you switch
# to a genuinely free-for-cost upstream.
#
# resolvePrice() strips the provider prefix and matches the bare model by
# prefix. LiteLLM reports this upstream as `openai/space-bunny`, so the
# bare form is `space-bunny`; the key below is that exact bare name.
models:
  space-bunny:
    input_per_mtok:          0.30   # NOMINAL placeholder — no published price
    cache_write_5m_per_mtok: 0.375
    cache_write_5m_note:     1.25x input (nominal, mirrors litellm.yaml)
    cache_write_1h_per_mtok: 0.60
    cache_write_1h_note:     2.0x input (nominal)
    cache_read_per_mtok:     0.03
    cache_read_note:         0.10x input (nominal)
    output_per_mtok:         1.20   # NOMINAL placeholder — no published price

# ── When the real Anthropic models return, restore rows like these ──
# (kept commented as the reference shape; multipliers are stable:
#  write-5m = 1.25x, write-1h = 2.0x, cache-read = 0.10x, EXCEPT
#  Fable 5.1 (0.025x) and Opus 5.5 (0.05x)).
#
#   claude-sonnet-5:
#     input_per_mtok:          2.00
#     cache_write_5m_per_mtok: 2.50
#     cache_write_1h_per_mtok: 4.00
#     cache_read_per_mtok:     0.20
#     output_per_mtok:         10.00
#
# Long-context tiers price differently above a context threshold.
# Add them explicitly rather than approximating.
#
# long_context:
#   threshold_tokens: 200000
#   input_per_mtok: 6.00
#   output_per_mtok: 22.50
