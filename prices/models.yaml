# Your price table. Reviewed monthly against the provider's live
# pricing page. Do NOT hardcode values from documentation examples.
#
# ── CURRENT UPSTREAMS ─────────────────────────────────────────────────
# fast     → GhostCLI claude-sonnet-5   (Responses API)
# smart    → GhostCLI claude-opus-5-5   (Responses API)
# frontier → GhostCLI claude-fable-5-1  (Pro-only, Responses API)
#
# Mirrored per-token in config/litellm.yaml's model_info — ONE table, TWO
# consumers (portal resolvePrice + scripts/reconcile.sh). tests/
# pricing-consistency.test.ts fails the suite on any drift between the two.
#
# Tier membership is by MEASURED latency, not quality — see HANDOFF.md
# §5.25 before reading any alias as "the best model".

models:
  # ── fast: Claude Sonnet 5 via GhostCLI ──
  claude-sonnet-5:
    input_per_mtok:          3.00
    cache_write_5m_per_mtok: 3.75
    cache_write_5m_note:     1.25x input
    cache_write_1h_per_mtok: 6.00
    cache_write_1h_note:     2.0x input
    cache_read_per_mtok:     0.30
    cache_read_note:         0.10x input
    output_per_mtok:         15.00

  # ── smart: Claude Opus 5.5 via GhostCLI ──
  claude-opus-5-5:
    input_per_mtok:          15.00
    cache_write_5m_per_mtok: 18.75
    cache_write_5m_note:     1.25x input
    cache_write_1h_per_mtok: 30.00
    cache_write_1h_note:     2.0x input
    cache_read_per_mtok:     1.50
    cache_read_note:         0.10x input
    output_per_mtok:         75.00

  # ── frontier: Claude Fable 5.1 via GhostCLI (Pro-only) ──
  claude-fable-5-1:
    input_per_mtok:          10.00
    cache_write_5m_per_mtok: 12.50
    cache_write_5m_note:     1.25x input
    cache_write_1h_per_mtok: 20.00
    cache_write_1h_note:     2.0x input
    cache_read_per_mtok:     0.25
    cache_read_note:         0.025x input
    output_per_mtok:         50.00

# ── Alias registry ──────────────────────────────────────────────────
aliases:
  claude-sonnet-5:    fast
  claude-opus-5-5:    smart
  claude-fable-5-1:   frontier