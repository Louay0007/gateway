# Your price table. Reviewed monthly against the provider's live
# pricing page. Do NOT hardcode values from documentation examples.
#
# ── CURRENT UPSTREAM (dev): howtofix.id ────────────────────────────
# Aliases: `fast` / `smart` / `frontier` → 11 deployments
# (base https://api.howtofix.id/v1)
#
# The upstream is FREE and this provider publishes NO pricing — /v1/models
# carries no `pricing` object (only id/object/created/owned_by/
# supported_endpoint_types) and completions return no `usage.cost`. The rates
# below are therefore NOMINAL DEV RATES, not real provider prices.
#
# They are TIERED (fast < smart < frontier) so a `frontier` budget behaves
# differently from a `fast` one — with one alias every request bills the same
# and a customer cannot express "cheap for bulk, expensive for the hard bits".
# Same multipliers throughout: write-5m = 1.25x input, write-1h = 2.0x,
# cache-read = 0.10x.
#
# They exist so the spend / budget / rollup pipeline stays exercisable end to
# end (a $0 model makes every budget a no-op and hides pipeline bugs). Replace
# with real numbers before any customer money depends on them.
#
# CAVEAT: this upstream has NO prompt caching, so the cache-write and
# cache-read rates are never actually charged — every request reports 0 cache
# tokens. They are here so the table is complete and the ledger has a column
# to fill the day a caching upstream appears, not because they are live today.
#
# Mirrored per-token in config/litellm.yaml's model_info — ONE table, TWO
# consumers (portal resolvePrice + scripts/reconcile.sh). tests/
# pricing-consistency.test.ts fails the suite on any drift between the two.
#
# resolvePrice() strips the provider prefix and matches the bare model by
# prefix, longest key first. LiteLLM reports `openai/space-bunny` and the
# upstream answers `"model":"space-bunny-free"`; both resolve to the key
# below. `mimo-v2.6-flash` is its own key so it never collapses into
# `mimo-v2.6`.
#
# Tier membership is by MEASURED latency, not quality — all eleven models tie
# on the quality probes. See HANDOFF.md §5.25 before reading `frontier` as
# "the best models".
# ── Alias registry ─────────────────────────────────────────────────
#
# WHICH alias each upstream model is sold under. This is the ONLY place tier
# membership is declared for the portal, and it lives here rather than being
# hardcoded in TypeScript so it cannot drift from the price rows above or
# from config/litellm.yaml — tests/pricing-consistency.test.ts asserts all
# three agree.
#
# WHY IT EXISTS AT ALL: the customer-facing surface shows aliases only. No
# upstream model name is ever rendered, exported, or stored in the ledger, so
# a provider swap or a model being dropped costs a deploy rather than
# becoming a customer-visible diff. collect-usage.ts resolves the gateway's
# resolved model name to an alias BEFORE writing usage_records, which is what
# makes that true rather than merely intended.
#
# Keep the keys identical to the model keys under `models:` below.
aliases:
  nemotron-3.5-lightning:  fast
  space-bunny:             fast
  cat-jam:                 fast
  deepseek-v4.1-flash:     fast
  longcat-2.5-preview:     smart
  mimo-v2.6:               smart
  mimo-v2.6-flash:         smart
  big-pickle:              smart
  grok-4.6-liberated:      frontier
  muse-spark-1.3-contributor: frontier
  muse-spark-1.2-contributor: frontier

models:
  # ── fast ($0.15 in / $0.60 out, nominal) — ttft 0.90–1.54s ──
  # 0.90s ttft, fastest measured
  nemotron-3.5-lightning:
    input_per_mtok:          0.15
    cache_write_5m_per_mtok: 0.1875
    cache_write_5m_note:     1.25x input (nominal, mirrors litellm.yaml)
    cache_write_1h_per_mtok: 0.3
    cache_write_1h_note:     2.0x input (nominal)
    cache_read_per_mtok:     0.015
    cache_read_note:         0.10x input (nominal)
    output_per_mtok:         0.6

  # most end-to-end verified; Codex was driven against this tier twice
  space-bunny:
    input_per_mtok:          0.15
    cache_write_5m_per_mtok: 0.1875
    cache_write_5m_note:     1.25x input (nominal, mirrors litellm.yaml)
    cache_write_1h_per_mtok: 0.3
    cache_write_1h_note:     2.0x input (nominal)
    cache_read_per_mtok:     0.015
    cache_read_note:         0.10x input (nominal)
    output_per_mtok:         0.6

