name: Deploy to VPS

# Two triggers, one job: push to main, or click "Run workflow".
#
# There is deliberately NO `pull_request` trigger here. This workflow runs
# on a SELF-HOSTED runner, which means it executes with the VPS user's own
# filesystem and Docker permissions. This repository is public, so a
# `pull_request` trigger would let anyone who opens a fork run arbitrary
# workflow code as the deploy user on the production box. Only maintainers
# who can push to main may deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping builds on one VPS will fight over
# the same images and can leave a half-recreated container.
concurrency:
  group: deploy-production
  # When a new push lands while a deploy is running or queued, cancel the
  # older run. Only the latest commit matters on a single VPS; keeping the
  # old run just delays the new one by minutes while producing a result
  # that will be overwritten moments later.
  cancel-in-progress: true

jobs:
  deploy:
    # PINNED TO THE ONE PRODUCTION BOX: `event-toolbox-db` = 197.5.133.66.
    #
    # That is the host serving zaino.soon.it / api.zaino.soon.it / the portal,
    # and the only box in the estate with a registered runner
    # (`gateway-db-prod`, labels: self-hosted, Linux, X64, production,
    # gateway-new). The boxes previously named in this comment
    # (15.188.66.155, 15.224.52.176) are decommissioned and unreachable on :22
    # — do not reintroduce them.
    #
    # WHY A LABEL AND NOT JUST THE DEFAULT SET. Default `self-hosted`/`Linux`/
    # `X64` labels are advertised by ANY self-hosted runner, so they pin
    # nothing: when two boxes both ran one, a push could deploy to the box DNS
    # no longer pointed at. `gateway-new` is carried only by the production
    # runner, so the job can land nowhere else.
    #
    # WHY THIS IS STILL NOT ENOUGH ON ITS OWN. A label is a promise made by a
    # registration someone can re-create on the wrong host. The IP assertion in
    # "Assert the deploy target" below is the part that makes it structural:
    # a job that somehow lands elsewhere fails on its first step with the
    # actual address printed, instead of quietly rebuilding the wrong stack.
    runs-on: [self-hosted, linux, x64, gateway-new]
    timeout-minutes: 45

    env:
      # The physical identity of production, asserted at run time. IPv4 only —
      # the box also carries Docker bridge addresses (172.17.0.1, …), which is
      # why the check looks for an exact match rather than "contains".
      EXPECTED_HOST_IP: 197.5.133.66

    defaults:
      run:
        # The one non-secret constant in this file. The project lives here
        # on the VPS; nothing about the app's configuration is in GitHub.
        working-directory: /opt/gateway

    steps:
      # FIRST STEP, BEFORE ANYTHING TOUCHES THE STACK.
      #
      # The runner label is the routing mechanism; this is the proof. A
      # self-hosted label only says how a runner was registered, and a runner
      # can be registered on the wrong machine by anyone with shell access to
      # it. If this job is not on the box DNS points at, every step below
      # would still succeed — it would just rebuild a stale stack nobody
      # reaches, and the deploy would report green. That is the failure this
      # step converts into a red run that names the address it actually found.
      #
      # It runs before the dirty-tree check on purpose: "wrong host" is the
      # more serious finding, and on a wrong host the dirty-tree result is
      # meaningless.
      - name: Assert the deploy target
        run: |
          echo "runner    : ${RUNNER_NAME:-unknown}"
          echo "hostname  : $(hostname)"
          echo "addresses : $(hostname -I)"
          if ! hostname -I | tr ' ' '\n' | grep -Fxq "$EXPECTED_HOST_IP"; then
            echo "::error::This job did not land on production ($EXPECTED_HOST_IP)."
            echo "Addresses found: $(hostname -I). Refusing to deploy here."
            echo "Check the runner registration for the 'gateway-new' label."
            exit 1
          fi
          echo "target    : event-toolbox-db ($EXPECTED_HOST_IP) — confirmed"

      - name: Show what is deploying
        run: |
          echo "commit  : $(git rev-parse HEAD)"
          echo "branch  : $(git rev-parse --abbrev-ref HEAD)"
          echo "trigger : ${{ github.event_name }}"
          echo "actor   : ${{ github.actor }}"

      # A tracked file edited by hand on the VPS would make `git pull`
      # refuse (good), but refusing AFTER the pull has already moved some
      # files is the confusing failure. Fail early, with an explanation.
      - name: Refuse to deploy a dirty tree
        run: |
          dirty=$(git status --porcelain --untracked-files=no)
          if [ -n "$dirty" ]; then
            echo "::error::Tracked files on the VPS differ from git. Refusing to deploy:"
            echo "$dirty"
            echo "Fix on the VPS (git checkout -- <file>) or commit the change, then re-run."
            exit 1
          fi
          echo "tree is clean"

      - name: Fast-forward to the pushed commit
        run: |
          git fetch origin main
          # --ff-only so a diverged history fails loudly instead of
          # silently generating a merge commit on the deploy box.
          git merge --ff-only origin/main
          echo "now at  : $(git rev-parse HEAD)"

      # Same sequence `make deploy` runs remotely. Migrations are
      # idempotent and forward-only, and they run BEFORE the new code is
      # up — so a deploy never serves code that expects a column the
      # database does not have yet.
      - name: Migrate database
        run: |
          make db-init
          make db-migrate

      # VALIDATE THE CADDYFILE BEFORE ANYTHING RESTARTS.
      #
      # This step exists because its absence shipped two bugs that `make
      # verify-caddy` would both have caught:
      #
      #   1. the live-share stream was not in the streaming matcher, so SSE
      #      fell to the default proxy's 120s read_timeout and every viewer
      #      reconnected silently two minutes in;
      #   2. adding it as a second argument to `route` is a caddyfile PARSE
      #      error — `route` takes exactly one matcher expression.
      #
      # A parse error does not fail the build. The stack starts, Caddy fails
      # to load its config, and the site goes down at reload — after a green
      # `docker compose up`. Catching it here means the deploy stops before
      # it replaces a working stack with a broken one.
      #
      # `--strict` is NOT used: the Caddyfile carries intentional warnings
      # (automatic HTTPS on the sslip test hosts). `verify-caddy` already
      # passes every interpolated domain, which is the failure mode that
      # produced the useless "server block without any key" error.
      - name: Validate the Caddyfile
        run: make verify-caddy

      # The engine's Rust compile is the only slow part of this deploy and it
      # is cached across runs by the cache mounts in engine/Dockerfile and
      # portal/Dockerfile, not by compose's layer cache. Layers are keyed on
      # their parents' digests, so an upstream re-push of the
      # `rust:1.99-slim-bookworm` tag invalidates every layer below it and
      # rebuilds tantivy, calyx and pdf-extract from zero — that is exactly
      # what turned a 3m37s deploy into 11m28s on 2026-11-06, with 492s of it
      # in one cargo step. A cache mount is keyed by mount id instead, so it
      # survives the base image moving and cargo's fingerprints skip every
      # crate whose inputs did not change.
      #
      # The first build after this change repopulates both mounts and pays
      # that cost once. Nothing else here needs to change.
      - name: Build and restart the stack
        run: docker compose up -d --build

      # `docker compose up --build` only recreates a container whose IMAGE
      # changed. config/litellm.yaml is a bind mount, so editing it does not
      # touch the image: compose leaves the running process alone and it keeps
      # serving whatever model_list it loaded at boot.
      #
      # That is not theoretical. On 2026-11-16 production answered 400
      # "Invalid model name" to every request for over an hour: the file on
      # disk was current, /model/info returned an empty list, and the YAML
      # plainly listed eight aliases. Nothing had reloaded it.
      #
      # A restart is seconds, and the alternative is a gateway whose config
      # silently disagrees with the repo.
      - name: Reload the gateway config
        run: docker compose restart litellm

      - name: Assert the gateway loaded its models
        run: |
          # The restart is only useful if the config actually parsed. An empty
          # model_list is the failure mode -- on 2026-11-16 production spent
          # an hour answering 400 "Invalid model name" while the YAML listed
          # eight aliases -- so fail the deploy here instead.
          #
          # Auth comes from .env on the host, the same source every script in
          # this repo reads. The litellm image has neither curl nor wget, so
          # the probe runs from the host against the published port.
          set -a; . ./.env; set +a
          for i in $(seq 1 12); do
            count=$(curl -s -m 10 \
              -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
              http://127.0.0.1:4000/model/info 2>/dev/null \
              | grep -o '"model_name"' | wc -l || true)
            if [ "${count:-0}" -ge 8 ]; then
              echo "gateway loaded $count model groups"
              exit 0
            fi
            sleep 5
          done
          echo "gateway has fewer than 8 model groups -- config/litellm.yaml did not load"
          docker compose logs --tail=40 litellm
          exit 1

      - name: Wait for health
        run: |
          sleep 8
          make health

      # `make health` prints FAIL and still exits 0 — it is a human
      # readout, not a gate. These checks assert, so a broken deploy marks
      # the run red instead of scrolling past.
      #
      # They also RETRY. Changing a service's environment recreates its
      # container, and the first version of this step asserted 8s after the
      # recreate and failed with curl code 000 — connection refused — while
      # the gateway was merely still booting. It called a working deploy
      # broken. A readiness gate has to wait for readiness.
      - name: Verify the deploy actually serves
        run: |
          set -uo pipefail

          code=000
          for i in $(seq 1 45); do
            code=$(curl -sS -m 5 -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:4000/health/readiness 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            echo "  gateway not ready (HTTP $code), attempt $i/45"
            sleep 4
          done
          [ "$code" = "200" ] \
            || { echo "::error::gateway readiness returned $code after 45 attempts"; exit 1; }
          echo "gateway readiness : 200"

          health=""
          for i in $(seq 1 45); do
            health=$(curl -sS -m 5 http://127.0.0.1:3000/api/health 2>/dev/null || echo "")
            echo "$health" | grep -q '"database":true' && break
            echo "  portal not healthy yet, attempt $i/45"
            sleep 4
          done
          echo "$health" | grep -q '"database":true' \
            || { echo "::error::portal reports database:false — $health"; exit 1; }
          echo "portal health     : ok"

          docker compose ps --status running --services | grep -qx jobs \
            || { echo "::error::jobs runner is not running"; exit 1; }
          echo "jobs runner       : running"

          # The engine is the attachment-extraction and search service. It
          # has no published port on purpose (compose exposes it only on the
          # stack network), so it cannot be curled from the host.
          #
          # Its OWN healthcheck is `zaino-engine --version`, which proves the
          # binary runs but NOT that the HTTP server bound a port. Asking
          # /health over the compose network is the only check that proves
          # the thing that matters, so it is asked from the portal container
          # (which carries wget; the engine image is slim and has none).
          #
          # This gate exists because the engine sat in compose for weeks
          # while never having been built: the UI advertised attachments and
          # every upload 502'd. "Container is up" is not "service answers".
          eng=""
          for i in $(seq 1 30); do
            eng=$(docker compose exec -T portal wget -qO- http://engine:8099/health 2>/dev/null || echo "")
            echo "$eng" | grep -q '"ok":true' && break
            eng=""
            echo "  engine not ready yet, attempt $i/30"
            sleep 3
          done
          [ -n "$eng" ] \
            || { echo "::error::engine /health did not answer ok:true — attachments and search are dead"; exit 1; }
          echo "engine            : $eng"

          # SearXNG is the web-search backend. Same failure as the engine:
          # a container that is "up" proves nothing, and the portal silently
          # degrades to "no results" — so a broken instance would look like
          # a model that answers without searching.
          #
          # The check asks a REAL query with format=json, because that is the
          # exact path lib/chat/web-search.ts uses: an instance whose JSON
          # API is disabled answers /healthz 200 and every search 403.
          sx=""
          for i in $(seq 1 20); do
            sx=$(docker compose exec -T portal wget -qO- \
              "http://searxng:8080/search?q=deploy+check&format=json" 2>/dev/null || echo "")
            echo "$sx" | grep -q '"results"' && break
            sx=""
            echo "  searxng not ready yet, attempt $i/20"
            sleep 3
          done
          [ -n "$sx" ] \
            || { echo "::error::searxng did not answer a JSON search — the Search button will do nothing"; exit 1; }
          echo "searxng           : json search ok"

          echo "deployed commit   : $(git rev-parse HEAD)"