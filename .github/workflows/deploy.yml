name: Deploy to VPS

# Two triggers, one job: push to main, or click "Run workflow".
#
# There is deliberately NO `pull_request` trigger here. This workflow runs
# on a SELF-HOSTED runner, which means it executes with the VPS user's own
# filesystem and Docker permissions. This repository is public, so a
# `pull_request` trigger would let anyone who opens a fork run arbitrary
# workflow code as the deploy user on the production box. Only maintainers
# who can push to main may deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping builds on one VPS will fight over
# the same images and can leave a half-recreated container.
concurrency:
  group: deploy-production
  # When a new push lands while a deploy is running or queued, cancel the
  # older run. Only the latest commit matters on a single VPS; keeping the
  # old run just delays the new one by minutes while producing a result
  # that will be overwritten moments later.
  cancel-in-progress: true

jobs:
  deploy:
    # PINNED TO THE NEW BOX.
    #
    # Both VPSs run a self-hosted runner, and both advertise the default
    # `self-hosted`/`Linux`/`X64` labels — so `runs-on: [self-hosted, linux, x64]`
    # was satisfied by BOTH of them. GitHub picks whichever is idle, which
    # means a push could deploy to the box DNS no longer points at, or fail
    # confusingly on the old box whose tree is dirty. `gateway-new` is a
    # label carried ONLY by the runner on 15.188.66.155, so the job can land
    # nowhere else.
    runs-on: [self-hosted, linux, x64, gateway-new]
    timeout-minutes: 45

    defaults:
      run:
        # The one non-secret constant in this file. The project lives here
        # on the VPS; nothing about the app's configuration is in GitHub.
        working-directory: /opt/gateway

    steps:
      - name: Show what is deploying
        run: |
          echo "commit  : $(git rev-parse HEAD)"
          echo "branch  : $(git rev-parse --abbrev-ref HEAD)"
          echo "trigger : ${{ github.event_name }}"
          echo "actor   : ${{ github.actor }}"

      # A tracked file edited by hand on the VPS would make `git pull`
      # refuse (good), but refusing AFTER the pull has already moved some
      # files is the confusing failure. Fail early, with an explanation.
      - name: Refuse to deploy a dirty tree
        run: |
          dirty=$(git status --porcelain --untracked-files=no)
          if [ -n "$dirty" ]; then
            echo "::error::Tracked files on the VPS differ from git. Refusing to deploy:"
            echo "$dirty"
            echo "Fix on the VPS (git checkout -- <file>) or commit the change, then re-run."
            exit 1
          fi
          echo "tree is clean"

      - name: Fast-forward to the pushed commit
        run: |
          git fetch origin main
          # --ff-only so a diverged history fails loudly instead of
          # silently generating a merge commit on the deploy box.
          git merge --ff-only origin/main
          echo "now at  : $(git rev-parse HEAD)"

      # Same sequence `make deploy` runs remotely. Migrations are
      # idempotent and forward-only, and they run BEFORE the new code is
      # up — so a deploy never serves code that expects a column the
      # database does not have yet.
      - name: Migrate database
        run: |
          make db-init
          make db-migrate

      # The engine's Rust compile is the only slow part of this deploy and it
      # is cached across runs by the cache mounts in engine/Dockerfile and
      # portal/Dockerfile, not by compose's layer cache. Layers are keyed on
      # their parents' digests, so an upstream re-push of the
      # `rust:1.99-slim-bookworm` tag invalidates every layer below it and
      # rebuilds tantivy, calyx and pdf-extract from zero — that is exactly
      # what turned a 3m37s deploy into 11m28s on 2026-11-06, with 492s of it
      # in one cargo step. A cache mount is keyed by mount id instead, so it
      # survives the base image moving and cargo's fingerprints skip every
      # crate whose inputs did not change.
      #
      # The first build after this change repopulates both mounts and pays
      # that cost once. Nothing else here needs to change.
      - name: Build and restart the stack
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          sleep 8
          make health

      # `make health` prints FAIL and still exits 0 — it is a human
      # readout, not a gate. These checks assert, so a broken deploy marks
      # the run red instead of scrolling past.
      #
      # They also RETRY. Changing a service's environment recreates its
      # container, and the first version of this step asserted 8s after the
      # recreate and failed with curl code 000 — connection refused — while
      # the gateway was merely still booting. It called a working deploy
      # broken. A readiness gate has to wait for readiness.
      - name: Verify the deploy actually serves
        run: |
          set -uo pipefail

          code=000
          for i in $(seq 1 45); do
            code=$(curl -sS -m 5 -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:4000/health/readiness 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            echo "  gateway not ready (HTTP $code), attempt $i/45"
            sleep 4
          done
          [ "$code" = "200" ] \
            || { echo "::error::gateway readiness returned $code after 45 attempts"; exit 1; }
          echo "gateway readiness : 200"

          health=""
          for i in $(seq 1 45); do
            health=$(curl -sS -m 5 http://127.0.0.1:3000/api/health 2>/dev/null || echo "")
            echo "$health" | grep -q '"database":true' && break
            echo "  portal not healthy yet, attempt $i/45"
            sleep 4
          done
          echo "$health" | grep -q '"database":true' \
            || { echo "::error::portal reports database:false — $health"; exit 1; }
          echo "portal health     : ok"

          docker compose ps --status running --services | grep -qx jobs \
            || { echo "::error::jobs runner is not running"; exit 1; }
          echo "jobs runner       : running"

          # The engine is the attachment-extraction and search service. It
          # has no published port on purpose (compose exposes it only on the
          # stack network), so it cannot be curled from the host.
          #
          # Its OWN healthcheck is `zaino-engine --version`, which proves the
          # binary runs but NOT that the HTTP server bound a port. Asking
          # /health over the compose network is the only check that proves
          # the thing that matters, so it is asked from the portal container
          # (which carries wget; the engine image is slim and has none).
          #
          # This gate exists because the engine sat in compose for weeks
          # while never having been built: the UI advertised attachments and
          # every upload 502'd. "Container is up" is not "service answers".
          eng=""
          for i in $(seq 1 30); do
            eng=$(docker compose exec -T portal wget -qO- http://engine:8099/health 2>/dev/null || echo "")
            echo "$eng" | grep -q '"ok":true' && break
            eng=""
            echo "  engine not ready yet, attempt $i/30"
            sleep 3
          done
          [ -n "$eng" ] \
            || { echo "::error::engine /health did not answer ok:true — attachments and search are dead"; exit 1; }
          echo "engine            : $eng"

          # SearXNG is the web-search backend. Same failure as the engine:
          # a container that is "up" proves nothing, and the portal silently
          # degrades to "no results" — so a broken instance would look like
          # a model that answers without searching.
          #
          # The check asks a REAL query with format=json, because that is the
          # exact path lib/chat/web-search.ts uses: an instance whose JSON
          # API is disabled answers /healthz 200 and every search 403.
          sx=""
          for i in $(seq 1 20); do
            sx=$(docker compose exec -T portal wget -qO- \
              "http://searxng:8080/search?q=deploy+check&format=json" 2>/dev/null || echo "")
            echo "$sx" | grep -q '"results"' && break
            sx=""
            echo "  searxng not ready yet, attempt $i/20"
            sleep 3
          done
          [ -n "$sx" ] \
            || { echo "::error::searxng did not answer a JSON search — the Search button will do nothing"; exit 1; }
          echo "searxng           : json search ok"

          echo "deployed commit   : $(git rev-parse HEAD)"