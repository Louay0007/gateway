[workspace]
members = ["engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "proprietary"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.24"
pdf-extract = "0.9"
calamine = "0.38"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
